<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050e26" />
      <stop offset="100%" stop-color="#0a1d47" />
    </linearGradient>
    <linearGradient id="voltGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#87e52c" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)" />
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1" />
  </pattern>
  <rect width="800" height="500" fill="url(#grid)" />

  <!-- Title Badge -->
  <rect x="25" y="20" width="430" height="32" rx="6" fill="rgba(14, 165, 233, 0.15)" stroke="#0284c7" stroke-width="1" />
  <text x="38" y="41" fill="#38bdf8" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="600">UPQC ARCHITECTURE · ANN INTELLIGENT CONTROLLER</text>
  <text x="770" y="41" text-anchor="end" fill="#87e52c" font-family="'IBM Plex Mono', monospace" font-size="11">MATLAB / SIMULINK</text>

  <!-- Power Bus Lines (Main Feeder) -->
  <line x1="40" y1="130" x2="760" y2="130" stroke="#38bdf8" stroke-width="3" filter="url(#glow)" />
  <text x="40" y="115" fill="#94a3b8" font-family="'IBM Plex Mono', monospace" font-size="11">GRID SUPPLY (Vs)</text>
  <text x="760" y="115" text-anchor="end" fill="#87e52c" font-family="'IBM Plex Mono', monospace" font-size="11">SENSITIVE LOAD (V_L = 1.0 p.u.)</text>

  <!-- Series Transformer & Series APF -->
  <rect x="180" y="105" width="130" height="50" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
  <text x="245" y="128" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="11" font-weight="600">SERIES APF</text>
  <text x="245" y="145" text-anchor="middle" fill="#94a3b8" font-family="'IBM Plex Mono', monospace" font-size="9">Voltage Sag/Swell Comp.</text>

  <!-- Shunt APF -->
  <rect x="520" y="105" width="130" height="50" rx="6" fill="#0f172a" stroke="#87e52c" stroke-width="2" />
  <text x="585" y="128" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="11" font-weight="600">SHUNT APF</text>
  <text x="585" y="145" text-anchor="middle" fill="#94a3b8" font-family="'IBM Plex Mono', monospace" font-size="9">Current Harmonic Comp.</text>

  <!-- Common DC-Link Capacitor -->
  <path d="M 245 155 L 245 220 L 585 220 L 585 155" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="4,4" />
  <rect x="360" y="200" width="110" height="40" rx="6" fill="#1e293b" stroke="#e2e8f0" stroke-width="1.5" />
  <text x="415" y="218" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="10" font-weight="600">DC-LINK (C_dc)</text>
  <text x="415" y="232" text-anchor="middle" fill="#87e52c" font-family="'IBM Plex Mono', monospace" font-size="9">V_dc Regulated</text>

  <!-- ANN Neural Controller Block -->
  <rect x="230" y="280" width="370" height="120" rx="10" fill="rgba(15, 23, 42, 0.95)" stroke="#a855f7" stroke-width="2" filter="url(#glow)" />
  <text x="415" y="306" text-anchor="middle" fill="#c084fc" font-family="Inter, sans-serif" font-size="13" font-weight="700">ARTIFICIAL NEURAL NETWORK (ANN) CONTROLLER</text>
  <text x="415" y="323" text-anchor="middle" fill="#94a3b8" font-family="'IBM Plex Mono', monospace" font-size="10">Levenberg-Marquardt Multi-Layer Backpropagation</text>

  <!-- Neural Net Node Graphics -->
  <!-- Layer 1 -->
  <circle cx="270" cy="355" r="7" fill="#38bdf8" />
  <circle cx="270" cy="380" r="7" fill="#38bdf8" />
  <!-- Layer 2 -->
  <circle cx="365" cy="345" r="7" fill="#c084fc" />
  <circle cx="365" cy="368" r="7" fill="#c084fc" />
  <circle cx="365" cy="390" r="7" fill="#c084fc" />
  <!-- Layer 3 (Output) -->
  <circle cx="460" cy="355" r="7" fill="#87e52c" />
  <circle cx="460" cy="380" r="7" fill="#87e52c" />

  <!-- Node Interconnections -->
  <line x1="277" y1="355" x2="358" y2="345" stroke="rgba(192, 132, 252, 0.4)" stroke-width="1" />
  <line x1="277" y1="355" x2="358" y2="368" stroke="rgba(192, 132, 252, 0.4)" stroke-width="1" />
  <line x1="277" y1="355" x2="358" y2="390" stroke="rgba(192, 132, 252, 0.4)" stroke-width="1" />
  <line x1="277" y1="380" x2="358" y2="345" stroke="rgba(192, 132, 252, 0.4)" stroke-width="1" />
  <line x1="277" y1="380" x2="358" y2="368" stroke="rgba(192, 132, 252, 0.4)" stroke-width="1" />
  <line x1="277" y1="380" x2="358" y2="390" stroke="rgba(192, 132, 252, 0.4)" stroke-width="1" />
  <line x1="372" y1="345" x2="453" y2="355" stroke="rgba(135, 229, 44, 0.4)" stroke-width="1" />
  <line x1="372" y1="368" x2="453" y2="355" stroke="rgba(135, 229, 44, 0.4)" stroke-width="1" />
  <line x1="372" y1="390" x2="453" y2="380" stroke="rgba(135, 229, 44, 0.4)" stroke-width="1" />

  <!-- Feedback and Gating Lines -->
  <path d="M 467 355 L 530 355 L 530 160" fill="none" stroke="#87e52c" stroke-width="1.5" stroke-dasharray="3,3" />
  <path d="M 270 345 L 210 345 L 210 160" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,3" />
  <text x="545" y="360" fill="#87e52c" font-family="'IBM Plex Mono', monospace" font-size="9">PWM Gating</text>
  <text x="140" y="340" fill="#38bdf8" font-family="'IBM Plex Mono', monospace" font-size="9">Voltage Ref.</text>

  <!-- Microgrid Renewable Block -->
  <rect x="50" y="300" width="140" height="75" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
  <text x="120" y="325" text-anchor="middle" fill="#38bdf8" font-family="Inter, sans-serif" font-size="11" font-weight="600">RENEWABLE MICROGRID</text>
  <text x="120" y="342" text-anchor="middle" fill="#94a3b8" font-family="'IBM Plex Mono', monospace" font-size="9">PV Array + Wind + BESS</text>
  <path d="M 120 300 L 120 130" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="2,2" />

  <!-- Scope Waveform Demonstration at Bottom -->
  <rect x="25" y="420" width="750" height="60" rx="6" fill="#030712" stroke="#334155" stroke-width="1" />
  <text x="35" y="438" fill="#f59e0b" font-family="'IBM Plex Mono', monospace" font-size="10">Grid Voltage Sag (30% drop):</text>
  <!-- Sagged sine wave -->
  <path d="M 220 435 Q 235 415 250 435 T 280 435 T 310 445 T 340 445 T 370 445 T 400 435" fill="none" stroke="#f59e0b" stroke-width="1.8" />
  <text x="430" y="438" fill="#87e52c" font-family="'IBM Plex Mono', monospace" font-size="10">UPQC Compensated Load Voltage (Clean 1.0 p.u. / THD &lt; 3%):</text>
  <!-- Pure stable sine wave -->
  <path d="M 430 460 Q 445 442 460 460 T 490 460 T 520 460 T 550 460 T 580 460 T 610 460 T 640 460 T 670 460 T 700 460 T 730 460 T 760 460" fill="none" stroke="#87e52c" stroke-width="2" filter="url(#glow)" />
</svg>
