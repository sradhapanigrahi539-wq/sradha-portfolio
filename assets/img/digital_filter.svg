<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050e26" />
      <stop offset="100%" stop-color="#0a1d47" />
    </linearGradient>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad2)" />
  <pattern id="grid2" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1" />
  </pattern>
  <rect width="800" height="500" fill="url(#grid2)" />

  <!-- Header -->
  <rect x="25" y="20" width="440" height="32" rx="6" fill="rgba(135, 229, 44, 0.12)" stroke="#87e52c" stroke-width="1" />
  <text x="38" y="41" fill="#87e52c" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="600">PYTHON DSP PIPELINE · DIGITAL FILTER &amp; FEATURE EXTRACTION</text>
  <text x="770" y="41" text-anchor="end" fill="#38bdf8" font-family="'IBM Plex Mono', monospace" font-size="11">SciPy.signal • NumPy</text>

  <!-- Left Block: Raw Signal Processing Stage -->
  <rect x="30" y="80" width="350" height="175" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
  <text x="45" y="105" fill="#f87171" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="600">RAW ELECTRICAL SENSOR SIGNAL (WITH 50Hz NOISE)</text>
  <!-- Noisy trace -->
  <path d="M 45 180 Q 60 140 75 190 T 105 130 T 135 210 T 165 150 T 195 200 T 225 125 T 255 190 T 285 140 T 315 210 T 345 160 T 365 180" fill="none" stroke="#f87171" stroke-width="1.5" />
  <text x="45" y="240" fill="#94a3b8" font-family="'IBM Plex Mono', monospace" font-size="9">SNR: -4.2 dB · High Harmonic Distortion + 50Hz Grid Hum</text>

  <!-- Right Block: Filtered Signal Stage -->
  <rect x="420" y="80" width="350" height="175" rx="8" fill="#0f172a" stroke="#87e52c" stroke-width="1.5" />
  <text x="435" y="105" fill="#87e52c" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="600">FILTERED OUTPUT WAVEFORM (ZERO-PHASE filtfilt)</text>
  <!-- Clean trace -->
  <path d="M 435 175 Q 455 125 475 175 T 515 175 T 555 175 T 595 175 T 635 175 T 675 175 T 715 175 T 755 175" fill="none" stroke="#87e52c" stroke-width="2.5" filter="url(#glowGreen)" />
  <text x="435" y="240" fill="#87e52c" font-family="'IBM Plex Mono', monospace" font-size="9">SNR: +28.6 dB · 50Hz Notch Attenuation > 45 dB</text>

  <!-- Filter Processing Blocks in Middle -->
  <rect x="30" y="275" width="220" height="100" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
  <text x="45" y="300" fill="#38bdf8" font-family="Inter, sans-serif" font-size="11" font-weight="700">1. IIR BUTTERWORTH FILTER</text>
  <text x="45" y="320" fill="#cbd5e1" font-family="'IBM Plex Mono', monospace" font-size="9">• Maximally flat passband</text>
  <text x="45" y="338" fill="#cbd5e1" font-family="'IBM Plex Mono', monospace" font-size="9">• Zero-phase forward-backward</text>
  <text x="45" y="356" fill="#cbd5e1" font-family="'IBM Plex Mono', monospace" font-size="9">• Cutoff: fc = 250 Hz (Order N=4)</text>

  <rect x="290" y="275" width="220" height="100" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
  <text x="305" y="300" fill="#f59e0b" font-family="Inter, sans-serif" font-size="11" font-weight="700">2. CHEBYSHEV NOTCH FILTER</text>
  <text x="305" y="320" fill="#cbd5e1" font-family="'IBM Plex Mono', monospace" font-size="9">• 50 Hz Powerline notch</text>
  <text x="305" y="338" fill="#cbd5e1" font-family="'IBM Plex Mono', monospace" font-size="9">• Quality Factor Q = 30</text>
  <text x="305" y="356" fill="#cbd5e1" font-family="'IBM Plex Mono', monospace" font-size="9">• Harmonic suppression</text>

  <rect x="550" y="275" width="220" height="100" rx="8" fill="#1e293b" stroke="#c084fc" stroke-width="1.5" />
  <text x="565" y="300" fill="#c084fc" font-family="Inter, sans-serif" font-size="11" font-weight="700">3. WAVELET DECOMPOSITION</text>
  <text x="565" y="320" fill="#cbd5e1" font-family="'IBM Plex Mono', monospace" font-size="9">• Daubechies (db4) DWT</text>
  <text x="565" y="338" fill="#cbd5e1" font-family="'IBM Plex Mono', monospace" font-size="9">• Multi-level soft thresholding</text>
  <text x="565" y="356" fill="#cbd5e1" font-family="'IBM Plex Mono', monospace" font-size="9">• Transient noise extraction</text>

  <!-- Bottom Frequency Domain Response -->
  <rect x="30" y="395" width="740" height="85" rx="8" fill="#030712" stroke="#334155" stroke-width="1" />
  <text x="45" y="415" fill="#94a3b8" font-family="'IBM Plex Mono', monospace" font-size="10">FREQUENCY RESPONSE |H(f)| (dB) — NOTCH AT 50 Hz &amp; PASSBAND ROLL-OFF</text>
  <!-- Frequency curve with notch -->
  <path d="M 45 440 L 220 440 L 240 470 L 260 440 L 450 442 L 600 460 L 740 475" fill="none" stroke="#38bdf8" stroke-width="2" />
  <circle cx="240" cy="470" r="4" fill="#f87171" />
  <text x="250" y="468" fill="#f87171" font-family="'IBM Plex Mono', monospace" font-size="9">50 Hz Notch (-48 dB)</text>
  <text x="630" y="450" fill="#94a3b8" font-family="'IBM Plex Mono', monospace" font-size="9">High-freq Roll-off</text>
</svg>
